<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#440F19">
<title>Registrace — BRKVIK 2027</title>
<meta name="description" content="Registrace na brněnský skautský festival Brkvík 2027 (16+) a vyhledání uložené přihlášky.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="/" class="brand-lockup" aria-label="BRKVIK 2027 — Domů">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" fill="#B7D2FD" stroke="#440F19" stroke-width="3"/>
        <path d="M20 57 L26 34 L35 33 L39 32 L56 31 L64 21 L70 21 L80 19 L76 22 L80 23 L76 25 L77 33 L74 35 L71 34 L71 30 L69 27 L66 40 L65 81 L61 78 L62 46 L60 46 L59 82 L55 79 L56 46 L48 47 L45 56 L39 60 L39 80 L34 83 L35 58 L41 53 L43 46 L39 46 L38 54 L32 59 L32 82 L27 85 L28 57 L34 52 L35 35 L29 36 L26 53 Z" fill="#F4380A"/>
        <path d="M39 22 C37 16 45 15 47 18 C48 19 44 20 44 21 L62 23 L63 22 L63 25 L60 27 L47 25 C46 26 47 28 48 29 L56 31 L45 32 L46 39 L40 48 L39 50 L37 45 L42 38 L42 32 L38 26 L39 33 L37 35 L35 33 L37 31 L35 24 L39 22 Z" fill="#440F19"/>
      </svg>
      <div class="brand-text">
        <span class="brand-title">BRKVIK</span>
        <span class="brand-year">2027</span>
      </div>
    </a>
    <a href="registrace" class="mobile-quick-cta">Registrace</a>
  </div>

  <nav class="site-nav" aria-label="Hlavní navigace">
    <a href="/"><span class="nav-num">01</span> Úvod</a>
    <a href="program"><span class="nav-num">02</span> Program</a>
    <a href="info"><span class="nav-num">03</span> Info</a>
    <a href="registrace" class="nav-cta is-current"><span class="nav-num">04</span> Registrace</a>
  </nav>
</header>

<main id="top">

<section id="ucet" class="swiss-section theme-dark">
  <div class="section-sidebar">
    <div class="sidebar-top">
      <span class="section-num">04</span>
      <h2 class="section-heading">HLÍDACÍ KŮŇ **íhahá**</h2>
    </div>
    <p class="sidebar-note">
      Registrace ještě nezačala. Nechte nám jméno a e-mail a <strong>dáme vám vědět dřív, než se přihlašování spustí</strong>. Festival je určen pro účastníky <strong>16+</strong>.
    </p>
  </div>

  <div class="section-content">
    <div class="account-box">
      <form id="watch-form" novalidate>
        <div class="form-grid">
          <div class="form-row">
            <label for="w-jmeno">Jméno a příjmení *</label>
            <input type="text" id="w-jmeno" name="jmeno" required autocomplete="name" enterkeyhint="next" placeholder="Jana Nováková">
          </div>
          <div class="form-row">
            <label for="w-email">E-mail *</label>
            <input type="email" id="w-email" name="email" required autocomplete="email" inputmode="email" enterkeyhint="send" placeholder="jana@skaut.cz">
          </div>
        </div>

        <!-- honeypot proti botům: člověk ho nevidí -->
        <div style="position:absolute;left:-9999px" aria-hidden="true">
          <input type="text" name="web" tabindex="-1" autocomplete="off">
        </div>

<div class="consent-row">
  <input type="checkbox" id="w-souhlas" name="souhlas" required>
  <label for="w-souhlas">
    Souhlasím, že mi organizátoři pošlou e-mail při spuštění registrace. Jméno a e-mail použijeme jen k tomu, po akci je smažeme. *
  </label>
</div>

        <button type="submit" class="btn btn-primary btn-block">Hlídat spuštění registrace</button>
        <p class="form-msg" id="watch-msg" role="status"></p>
      </form>

      <p class="form-msg" id="unsub-msg" role="status"></p>
    </div>
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="footer-grid">
    <div class="footer-cell">
      <span class="footer-title">BRKVIK 2027</span>
      <p>Brněnský kulturní víkend</p>
    </div>
    <div class="footer-cell">
      <span class="footer-label">KONTAKT</span>
      <p><a href="mailto:info@brkvik.cz">info@brkvik.cz</a></p>
    </div>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
